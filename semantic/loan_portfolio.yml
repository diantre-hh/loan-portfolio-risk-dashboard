# Семантическая модель поверх очищенной витрины.
# Одна строка источника = кредит на дату среза, только портфель (без списанных).
# Доли (PAR30, PAR90, NPL) задаются как суммы числителя и знаменателя:
# долю считает слой отчёта как ratio(par30_kzt, portfolio_kzt), а не avg по строкам.
model: loan_portfolio
label: Кредитный портфель
source: reporting.v_portfolio
grain: [report_date, loan_id]

dimensions:
  - name: report_date
    column: report_date
    type: date
    label: Дата среза
  - name: sector
    column: sector
    type: string
    label: Отрасль
  - name: program
    column: program
    type: string
    label: Программа
  - name: currency
    column: currency
    type: string
    label: Валюта кредита
  - name: dpd_bucket
    column: dpd_bucket
    type: string
    label: Корзина просрочки
  - name: group_id
    column: group_id
    type: string
    label: Группа связанных заёмщиков
  - name: borrower_id
    column: borrower_id
    type: string
    label: Заёмщик
  - name: is_restructured
    column: is_restructured
    type: boolean
    label: Реструктуризирован
  - name: is_npl
    column: is_npl
    type: boolean
    label: NPL

measures:
  - name: loans
    column: loan_id
    type: count
    format: "#,##0"
    label: Кредитов, шт.
  - name: portfolio_kzt
    column: outstanding_kzt
    type: sum
    format: "#,##0 ₸"
    label: Портфель, ₸
  - name: par30_kzt
    column: outstanding_kzt
    type: sum
    filter: is_par30
    format: "#,##0 ₸"
    label: Портфель с просрочкой > 30 дней, ₸
  - name: par90_kzt
    column: outstanding_kzt
    type: sum
    filter: is_par90
    format: "#,##0 ₸"
    label: Портфель с просрочкой > 90 дней, ₸
  - name: npl_kzt
    column: outstanding_kzt
    type: sum
    filter: is_npl
    format: "#,##0 ₸"
    label: NPL, ₸
  - name: provisions_kzt
    column: provision_kzt
    type: sum
    format: "#,##0 ₸"
    label: Провизии, ₸
  - name: avg_dpd
    column: days_past_due
    type: avg
    format: "0.0"
    label: Средняя просрочка, дней

# Производные показатели: отношение двух мер выше.
ratios:
  - name: par30_share
    numerator: par30_kzt
    denominator: portfolio_kzt
    format: "0.0%"
    label: PAR30
  - name: par90_share
    numerator: par90_kzt
    denominator: portfolio_kzt
    format: "0.0%"
    label: PAR90
  - name: npl_share
    numerator: npl_kzt
    denominator: portfolio_kzt
    format: "0.0%"
    label: NPL
  - name: npl_coverage
    numerator: provisions_kzt
    denominator: npl_kzt
    format: "0.0%"
    label: Покрытие NPL провизиями
